version: '3.8'

services:
  # ============================================================================
  # 1. BANCO DE DADOS POSTGRESQL 16 (Porta 5433 no Host para evitar conflito)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - saas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_saas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. REDIS (Porta 6380 no Host para evitar conflito)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. BACKEND API (Porta 8001 no Host)
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saas_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ecommerce_saas}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ecommerce_saas}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-jwt-key-2026-saas-platform}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-GTp1Y_2StR1idjKIEEShehpZXWbAKS3xlXSnom8lAoY=}
      - CNAME_TARGET=${CNAME_TARGET:-cname.seusistema.com.br}
      - MAIN_DOMAINS=${MAIN_DOMAINS:-seusistema.com.br,app.seusistema.com.br,localhost}
      - UPLOAD_DIR=/app/uploads
      - ENVIRONMENT=production
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8001:8000"
    networks:
      - saas_network

  # ============================================================================
  # 4. FRONTEND (Porta 3001 no Host)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: saas_frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - BACKEND_INTERNAL_URL=http://api:8000
    ports:
      - "3001:3000"
    networks:
      - saas_network

  # ============================================================================
  # 5. REVERSE PROXY CADDY (Portas 8080 e 8443 no Host)
  # ============================================================================
  caddy:
    image: caddy:2-alpine
    container_name: saas_caddy
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - saas_network

# ============================================================================
# REDES & VOLUMES PERSISTENTES
# ============================================================================
networks:
  saas_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:
