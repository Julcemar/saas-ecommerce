services:
  # ============================================================================
  # 1. BANCO DE DADOS POSTGRESQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_saas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    expose:
      - "5432"
    networks:
      - saas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 2. REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - saas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================================================================
  # 3. BACKEND API (FastAPI - Porta interna 8000)
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ecommerce_saas}
      - SYNC_DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-ecommerce_saas}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-jwt-key-2026-saas-platform}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-GTp1Y_2StR1idjKIEEShehpZXWbAKS3xlXSnom8lAoY=}
      - CNAME_TARGET=${CNAME_TARGET:-cname.seusistema.com.br}
      - MAIN_DOMAINS=${MAIN_DOMAINS:-seusistema.com.br,app.seusistema.com.br,localhost}
      - PLATFORM_BASE_URL=${PLATFORM_BASE_URL:-https://seusistema.com.br}
      - MELHORENVIO_CLIENT_ID=${MELHORENVIO_CLIENT_ID:-}
      - MELHORENVIO_CLIENT_SECRET=${MELHORENVIO_CLIENT_SECRET:-}
      - MELHORENVIO_REDIRECT_URI=${MELHORENVIO_REDIRECT_URI:-}
      - UPLOAD_DIR=/app/uploads
      - ENVIRONMENT=production
    volumes:
      - uploads_data:/app/uploads
    expose:
      - "8000"
    networks:
      - saas_network
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 4. FRONTEND (Next.js - Porta interna 3000)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_INTERNAL_URL=http://api:8000
    expose:
      - "3000"
    networks:
      - saas_network
      - dokploy-network

# ============================================================================
# REDES & VOLUMES PERSISTENTES
# ============================================================================
networks:
  saas_network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  uploads_data:
